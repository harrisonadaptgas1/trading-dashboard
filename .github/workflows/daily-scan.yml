name: Scan

on:
  schedule:
    # Every 30 minutes, 14:30 to 20:00 UK, Monday to Friday.
    #
    # GitHub cron is always UTC and does not follow British Summer Time, so
    # these are written for BST (UTC+1). Between late October and late March
    # the whole window lands an hour earlier in UK time, 13:30-19:00.
    - cron: '30 13 * * 1-5'       # 14:30 UK
    - cron: '0,30 14-18 * * 1-5'  # 15:00 - 19:30 UK
    - cron: '0 19 * * 1-5'        # 20:00 UK
    # One overnight run so the morning view is ready before the working day.
    - cron: '0 5 * * 1-5'         # 06:00 UK
  workflow_dispatch: {}  # lets you run it by hand from the Actions tab

# Least privilege: write the committed data file, publish Pages, nothing else.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two scans publish at once.
concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Scan watchlist
        run: npm run scan

      - name: Build the public site data
        run: node src/publish.js --public

      # Pages deploys from the uploaded artifact, so committing is not needed to
      # publish. It runs once a day only, because 18 commits a day of a 66KB file
      # would bloat the repository for no benefit — and because a commit keeps
      # the repo active, which stops GitHub auto-disabling scheduled workflows
      # after 60 days of inactivity.
      - name: Commit the day's data
        if: github.event.schedule == '0 5 * * 1-5' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/site.json public/index.html
          if git diff --staged --quiet; then
            echo "No change in scan output"
          else
            git commit -m "Scan $(date -u +'%Y-%m-%d')"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
